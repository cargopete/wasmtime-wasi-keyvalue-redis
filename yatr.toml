# yatr - https://github.com/cargopete/yatr

[env]
CARGO_TERM_COLOR = "always"

[settings]
cache = true

[tasks.fmt]
desc = "Format the tree"
run = ["cargo fmt --all"]
no_cache = true

[tasks.fmt-check]
desc = "Fail if the tree is unformatted"
run = ["cargo fmt --all --check"]
sources = ["crates/**/*.rs"]

[tasks.lint]
desc = "Clippy with warnings denied"
run = ["cargo clippy --workspace --all-targets -- -D warnings"]
sources = ["crates/**", "Cargo.toml", "Cargo.lock"]

[tasks.test]
desc = "The test suite (needs Redis on 127.0.0.1:6379)"
run = ["cargo test --workspace"]
sources = ["crates/**", "Cargo.toml", "Cargo.lock"]
watch = ["crates/**"]

[tasks.package]
desc = "cargo publish --dry-run: packages and builds the crate, uploads nothing"
run = ["cargo publish --dry-run -p wasmtime-wasi-keyvalue-redis"]
sources = ["crates/**", "Cargo.toml", "Cargo.lock"]

[tasks.ci]
desc = "fmt-check, lint, test"
depends = ["fmt-check", "lint", "test"]
run = []
